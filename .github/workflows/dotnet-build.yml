name: .NET build

on:
  push:
    branches:
      - gpt/public-release-v0.20
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VirtualQHDMirror.sln

      - name: Build
        run: dotnet build VirtualQHDMirror.sln --configuration Release --no-restore
